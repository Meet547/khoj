repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: sh -c 'cd khoj-backend && uv run mypy app'
        language: system
        pass_filenames: false
        files: ^khoj-backend/.*\.py$
