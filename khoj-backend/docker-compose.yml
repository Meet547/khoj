name: khoj
x-backend: &backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://khoj_app:khoj-local-only@postgres:5432/khoj
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: khoj
      POSTGRES_DB: khoj
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_app_role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khoj -d khoj"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://khoj:khoj@postgres:5432/khoj
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
  api:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
