name: Backend foundation
on:
  push:
    paths: ['khoj-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['khoj-backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khoj-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khoj
          POSTGRES_PASSWORD: khoj
          POSTGRES_DB: khoj_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U khoj -d khoj_test'
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      KHOJ_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://khoj:khoj@localhost:5432/khoj_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -ra
      - run: uv run python scripts/eval_extraction.py --fake --heldout evals/extraction/heldout.v1.jsonl --output ../artifacts/b2/extraction-ci.json
      - run: uv run python scripts/demo_intake.py --fake --output ../artifacts/b2/hindi-demo-ci.json
        env:
          DATABASE_URL: postgresql+asyncpg://khoj:khoj@localhost:5432/khoj_test
          REDIS_URL: redis://localhost:6379/15
      - uses: actions/upload-artifact@v4
        with:
          name: b2-intake-demo-and-evals
          path: artifacts/b2/*.json
